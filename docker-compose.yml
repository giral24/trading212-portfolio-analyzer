services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portfolio_analyzer
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting Postgres}
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - portfolio_analyzer_secure_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portfolio -d portfolio_analyzer']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  portfolio_analyzer_secure_postgres_data:
